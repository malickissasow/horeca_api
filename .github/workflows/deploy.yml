name: Deploy API to api.horecafrica.org (Hostinger FTP)

on:
  push:
    branches: [ main, production ]
    paths:
      - 'src/**'
      - 'routes/**'
      - 'services/**'
      - 'controllers/**'
      - 'models/**'
      - 'migrations/**'
      - 'config/**'
      - 'db/**'
      - 'package.json'
      - 'server.js'
      - '.htaccess'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  deploy-api-horecafrica:
    name: 🚀 Isolated Deploy API to api.horecafrica.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📤 FTP Deploy API Backend to Hostinger
        run: python deploy_api_ftp.py
        env:
          FTP_HOST: 92.113.24.18
          FTP_USER: u208608546.api.horecafrica.org
          FTP_PASS: B5@9ll@c

      - name: Deployment Summary
        run: echo "🎉 API Application deployed strictly to https://api.horecafrica.org"
